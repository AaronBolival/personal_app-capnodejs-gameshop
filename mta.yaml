_schema-version: 3.3.0
ID: GameShop
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - mkdir -p resources
modules:
  - name: GameShop-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: GameShop-db
      - name: GameShop-destination

  - name: GameShop-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: GameShop-db
  - name: GameShop
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: GameShop-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: GameShop-app-deployer
    type: com.sap.application.content
    path: .
    build-parameters:
      build-result: resources/
      requires:
        - name: GameShopzageratingshopui
          artifacts:
            - zageratingshopui.zip
          target-path: resources/
        - name: GameShopzreviewshopui
          artifacts:
            - zreviewshopui.zip
          target-path: resources/
    requires:
      - name: srv-api
      - name: GameShop-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: GameShopzageratingshopui
    type: html5
    path: app/zageratingshopui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: GameShopzreviewshopui
    type: html5
    path: app/zreviewshopui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: GameShop-destinations
    type: com.sap.application.content
    requires:
      - name: GameShop-html5-repo-host
        parameters:
          service-key:
            name: GameShop-html5-repo-host-key
      - name: srv-api
      - name: GameShop-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: GameShop-html5-repository
              ServiceInstanceName: GameShop-html5-repo-host
              ServiceKeyName: GameShop-html5-repo-host-key
              sap.cloud.service: GameShop.service

resources:
  - name: GameShop-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: GameShop-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: GameShop-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: GameShop-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
