_schema-version: 3.3.0
ID: GameShop
description: A simple CAP project.
version: 1.0.0
modules:
- name: GameShop-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: GameShop-db
  - name: GameShop-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: GameShop-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: GameShop-db
  parameters:
    buildpack: nodejs_buildpack
- name: GameShop
  type: approuter.nodejs
  path: app/router
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: GameShop-html5-runtime
  - name: GameShop-destination
    group: destinations
    properties:
      forwardAuthToken: false
      name: ui5
      url: https://ui5.sap.com
  provides:
  - name: app-api
    properties:
      app-protocol: ${protocol}
      app-uri: ${default-uri}
  parameters:
    disk-quota: 256M
    keep-existing-routes: true
    memory: 256M
- name: GameShop-app-deployer
  type: com.sap.application.content
  path: .
  requires:
  - name: srv-api
  - name: GameShop-html5-repo-host
    parameters:
      config:
        HTML5Runtime_enabled: true
      content-target: true
  parameters:
    config:
      destinations:
      - Authentication: NoAuthentication
        DynamicDestination: true
        ForwardAuthToken: true
        Name: srv-api
        ProxyType: Internet
        Type: HTTP
        URL: ~{srv-api/srv-url}
  build-parameters:
    build-result: resources/
    requires:
    - artifacts:
      - zageratingshopui.zip
      name: GameShopzageratingshopui
      target-path: resources/
    - artifacts:
      - zreviewshopui.zip
      name: GameShopzreviewshopui
      target-path: resources/
    - artifacts:
      - zreviewviewshopui.zip
      name: zreviewviewshopui
      target-path: resources/
    - artifacts:
      - zgameshopui.zip
      name: zgameshopui
      target-path: resources/
- name: GameShopzageratingshopui
  type: html5
  path: app/zageratingshopui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm ci
    - npm run build
    supported-platforms: []
- name: GameShopzreviewshopui
  type: html5
  path: app/zreviewshopui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm ci
    - npm run build
    supported-platforms: []
- name: zreviewviewshopui
  type: html5
  path: app/zreviewviewshopui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm ci
    - npm run build
    supported-platforms: []
- name: GameShop-destinations
  type: com.sap.application.content
  requires:
  - name: GameShop-html5-repo-host
    parameters:
      service-key:
        name: GameShop-html5-repo-host-key
  - name: srv-api
  - name: GameShop-destination
    parameters:
      content-target: true
  parameters:
    content:
      instance:
        destinations:
        - Name: GameShop-html5-repository
          ServiceInstanceName: GameShop-html5-repo-host
          ServiceKeyName: GameShop-html5-repo-host-key
          sap.cloud.service: GameShop.service
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: zgameshopui
  type: html5
  path: app/zgameshopui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm ci
    - npm run build
    supported-platforms: []
resources:
- name: GameShop-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: GameShop-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false #Should be false to avoid duplication application names in html5 applications
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
- name: GameShop-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: GameShop-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
    - mkdir -p resources
